name: tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: smoke-and-pytest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Ставится ДО tests/run.sh: кейс 92 гоняет pre-commit-хук, а тот
        # запускает pytest внутри песочницы. Без этого шага смоук падал на
        # "No module named pytest" — и второй шаг с pytest не начинался вовсе.
        #
        # Без --user намеренно. tests/run.sh подменяет HOME на временный
        # каталог, поэтому user site раннера внутри песочницы не виден:
        # pytest, поставленный с --user, пропал бы ровно там, где нужен.
        run: python3 -m pip install pytest

      - name: Run tests/run.sh
        # Isolated runner: TMP_HOME + BRAIN_PATH. Do not invoke tests/cases
        # directly — they inherit the working tree and rewrite live data.
        run: bash tests/run.sh

      - name: Run pytest
        run: PYTHONPATH=runtime/lib python3 -m pytest -q

  guard:
    name: brain-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generic PII and secrets
        # --generic-only: named denylist stays off the runner.
        run: python3 runtime/bin/brain-guard tree --brain . --generic-only
